<!doctype html>
<html>
  <body>
    <form id="form">
      <div>
        <label>
          API key
          <input id="apiKey" type="password" required>
        </label>
      </div>

      <div>
        <label>
          Model slug
          <input id="model" value="tencent/hy3:free" required>
        </label>
      </div>

      <div>
        <label>
          Prompt
          <textarea id="prompt" required>hi</textarea>
        </label>
      </div>

      <button>Send</button>
    </form>

    <pre id="output"></pre>

    <script>
      const form = document.getElementById("form");
      const output = document.getElementById("output");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        output.textContent = "Loading...";

        const apiKey = document.getElementById("apiKey").value;
        const model = document.getElementById("model").value;
        const prompt = document.getElementById("prompt").value;

        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json",
              "HTTP-Referer": location.origin,
              "X-Title": "Minimal OpenRouter Static Site"
            },
            body: JSON.stringify({
              model,
              messages: [
                { role: "user", content: prompt }
              ]
            })
          });

          const data = await response.json();

          if (!response.ok) {
            output.textContent = JSON.stringify(data, null, 2);
            return;
          }

          output.textContent = data.choices?.[0]?.message?.content ?? JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
