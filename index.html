<!doctype html>
<html>
  <body>
    <form id="form">
      <div>
        <button id="settingsButton" type="button">Settings</button>
        <button id="newSessionButton" type="button">New Session</button>
      </div>

      <ul id="sessionList"></ul>

      <div>
        <label>
          Prompt
          <textarea id="prompt">hi</textarea>
        </label>
      </div>

      <button id="sendButton">Send</button>
    </form>

    <dialog id="settingsDialog">
      <form method="dialog">
        <div>
          <label>
            API key
            <input id="apiKeyInput" type="password">
          </label>
        </div>

        <div>
          <label>
            Model slug
            <input id="modelInput" value="tencent/hy3:free" required>
          </label>
        </div>

        <button id="saveSettingsButton" type="button">Save</button>
        <button type="submit">Cancel</button>
      </form>
    </dialog>

    <dialog id="errorDialog">
      <form method="dialog">
        <p id="errorMessage"></p>
        <button type="submit">OK</button>
      </form>
    </dialog>

    <pre id="output"></pre>

    <script>
      const form = document.getElementById("form");
      const output = document.getElementById("output");
      const settingsButton = document.getElementById("settingsButton");
      const newSessionButton = document.getElementById("newSessionButton");
      const sendButton = document.getElementById("sendButton");
      const sessionList = document.getElementById("sessionList");
      const settingsDialog = document.getElementById("settingsDialog");
      const apiKeyInput = document.getElementById("apiKeyInput");
      const modelInput = document.getElementById("modelInput");
      const saveSettingsButton = document.getElementById("saveSettingsButton");
      const errorDialog = document.getElementById("errorDialog");
      const errorMessage = document.getElementById("errorMessage");

      let apiKey = localStorage.getItem("openrouterApiKey") || "";
      let model = localStorage.getItem("openrouterModel") || "tencent/hy3:free";
      let currentSession = null;
      let activeController = null;

      function setSessionIdInUrl(sessionId) {
        const url = new URL(location.href);

        if (sessionId) {
          url.searchParams.set("session", sessionId);
        } else {
          url.searchParams.delete("session");
        }

        history.replaceState(null, "", url);
      }

      function loadCurrentSessionFromUrl() {
        const sessionId = new URL(location.href).searchParams.get("session");

        try {
          currentSession = sessionId ? JSON.parse(localStorage.getItem(`session:${sessionId}`) || "null") : null;
        } catch {
          currentSession = null;
        }

        if (!currentSession) {
          setSessionIdInUrl("");
        }

        return currentSession;
      }

      function saveCurrentSession() {
        if (!currentSession?.id) {
          return null;
        }

        localStorage.setItem(`session:${currentSession.id}`, JSON.stringify(currentSession));
        return currentSession;
      }

      function createSessionId() {
        return Array.from(
          { length: 8 },
          () => "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"[Math.floor(Math.random() * 62)]
        ).join("");
      }

      function createOrUpdateCurrentSession(messages) {
        const now = new Date().toISOString();

        currentSession = {
          id: currentSession?.id || createSessionId(),
          createdAt: currentSession?.createdAt || now,
          updatedAt: now,
          messages
        };

        setSessionIdInUrl(currentSession.id);
        return currentSession;
      }

      function render() {
        sendButton.textContent = activeController ? "Abort" : "Send";

        output.textContent = (currentSession?.messages || [])
          .map((message) => `${message.role}: ${message.content}`)
          .join("\n\n");

        sessionList.textContent = "";

        Object.keys(localStorage)
          .filter((key) => key.startsWith("session:"))
          .map((key) => {
            try {
              return JSON.parse(localStorage.getItem(key));
            } catch {
              return null;
            }
          })
          .filter((session) => session?.id && session.updatedAt)
          .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
          .forEach((session) => {
            const firstUserMessage = session.messages?.find((message) => message.role === "user")?.content || "Untitled session";
            const title = firstUserMessage.length > 40 ? `${firstUserMessage.slice(0, 40)}…` : firstUserMessage;
            const updatedAt = new Date(session.updatedAt);
            const formattedUpdatedAt = [
              String(updatedAt.getDate()).padStart(2, "0"),
              String(updatedAt.getMonth() + 1).padStart(2, "0"),
              updatedAt.getFullYear()
            ].join("/") + ` ${String(updatedAt.getHours()).padStart(2, "0")}:${String(updatedAt.getMinutes()).padStart(2, "0")}`;
            const item = document.createElement("li");
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = `${title} ${formattedUpdatedAt}`;
            button.addEventListener("click", () => {
              setSessionIdInUrl(session.id);
              loadCurrentSessionFromUrl();
              render();
            });

            item.appendChild(button);
            sessionList.appendChild(item);
          });
      }

      settingsButton.addEventListener("click", () => {
        apiKeyInput.value = apiKey;
        modelInput.value = model;
        settingsDialog.showModal();
      });

      saveSettingsButton.addEventListener("click", () => {
        apiKey = apiKeyInput.value;
        model = modelInput.value;
        localStorage.setItem("openrouterApiKey", apiKey);
        localStorage.setItem("openrouterModel", model);
        settingsDialog.close();
      });

      newSessionButton.addEventListener("click", () => {
        currentSession = null;
        // Push a new history entry so Back returns to the previous session.
        const url = new URL(location.href);
        url.searchParams.delete("session");
        history.pushState(null, "", url);
        render();
      });

      window.addEventListener("popstate", () => {
        loadCurrentSessionFromUrl();
        render();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (activeController) {
          activeController.abort();
          return;
        }

        if (!apiKey) {
          errorMessage.textContent = "API key is missing. Add it in Settings.";
          errorDialog.showModal();
          return;
        }

        const promptInput = document.getElementById("prompt");
        const prompt = promptInput.value.trim();
        const requestMessages = prompt ? [...(currentSession?.messages || []), { role: "user", content: prompt }] : currentSession?.messages || [];
        const streamingSession = createOrUpdateCurrentSession([...requestMessages, { role: "assistant", content: "" }]);
        const assistantMessage = streamingSession.messages[streamingSession.messages.length - 1];
        let lastSave = 0;

        saveCurrentSession();
        activeController = new AbortController();
        render();
        promptInput.value = "";

        const saveStreamingSession = () => {
          streamingSession.updatedAt = new Date().toISOString();
          localStorage.setItem(`session:${streamingSession.id}`, JSON.stringify(streamingSession));
        };

        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json",
              "HTTP-Referer": location.origin,
              "X-Title": "Minimal OpenRouter Static Site"
            },
            body: JSON.stringify({
              model,
              messages: requestMessages,
              stream: true
            }),
            signal: activeController.signal
          });

          if (!response.ok) {
            const text = await response.text();
            let data;

            try {
              data = JSON.parse(text);
            } catch {
              data = text;
            }

            errorMessage.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
            errorDialog.showModal();
            return;
          }

          if (!response.body) {
            throw new Error("Response body is not readable.");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let done = false;

          while (!done) {
            const result = await reader.read();
            buffer += decoder.decode(result.value || new Uint8Array(), { stream: !result.done });

            const lines = buffer.split(/\r?\n/);
            buffer = result.done ? "" : lines.pop();

            for (const line of lines) {
              const trimmedLine = line.trim();

              if (!trimmedLine || trimmedLine.startsWith(":")) {
                continue;
              }

              if (!trimmedLine.startsWith("data:")) {
                continue;
              }

              const data = trimmedLine.slice(5).trim();

              if (data === "[DONE]") {
                done = true;
                break;
              }

              const chunk = JSON.parse(data);

              if (chunk.error) {
                errorMessage.textContent = JSON.stringify(chunk.error, null, 2);
                errorDialog.showModal();
                done = true;
                break;
              }

              assistantMessage.content += chunk.choices?.[0]?.delta?.content || "";
              render();

              if (Date.now() - lastSave >= 500) {
                saveStreamingSession();
                lastSave = Date.now();
              }
            }

            if (result.done) {
              break;
            }
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            errorMessage.textContent = String(error);
            errorDialog.showModal();
          }
        } finally {
          activeController = null;
          saveStreamingSession();
          render();
        }
      });

      loadCurrentSessionFromUrl();
      render();
    </script>
  </body>
</html>
