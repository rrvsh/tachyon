<!doctype html>
<html>
  <body>
    <form id="form">
      <div>
        <button id="settingsButton" type="button">Settings</button>
        <button id="newSessionButton" type="button">New Session</button>
      </div>

      <ul id="sessionList"></ul>

      <div>
        <label>
          Prompt
          <textarea id="prompt" required>hi</textarea>
        </label>
      </div>

      <button>Send</button>
    </form>

    <dialog id="settingsDialog">
      <form method="dialog">
        <div>
          <label>
            API key
            <input id="apiKeyInput" type="password">
          </label>
        </div>

        <div>
          <label>
            Model slug
            <input id="modelInput" value="tencent/hy3:free" required>
          </label>
        </div>

        <button id="saveSettingsButton" type="button">Save</button>
        <button type="submit">Cancel</button>
      </form>
    </dialog>

    <dialog id="errorDialog">
      <form method="dialog">
        <p id="errorMessage"></p>
        <button type="submit">OK</button>
      </form>
    </dialog>

    <pre id="output"></pre>

    <script>
      const form = document.getElementById("form");
      const output = document.getElementById("output");
      const settingsButton = document.getElementById("settingsButton");
      const newSessionButton = document.getElementById("newSessionButton");
      const sessionList = document.getElementById("sessionList");
      const settingsDialog = document.getElementById("settingsDialog");
      const apiKeyInput = document.getElementById("apiKeyInput");
      const modelInput = document.getElementById("modelInput");
      const saveSettingsButton = document.getElementById("saveSettingsButton");
      const errorDialog = document.getElementById("errorDialog");
      const errorMessage = document.getElementById("errorMessage");

      let apiKey = localStorage.getItem("openrouterApiKey") || "";
      let model = localStorage.getItem("openrouterModel") || "tencent/hy3:free";

      function setSessionIdInUrl(sessionId) {
        const url = new URL(location.href);

        if (sessionId) {
          url.searchParams.set("session", sessionId);
        } else {
          url.searchParams.delete("session");
        }

        history.replaceState(null, "", url);
      }

      function readSession() {
        const sessionId = new URL(location.href).searchParams.get("session");

        if (!sessionId) {
          return null;
        }

        try {
          return JSON.parse(localStorage.getItem(`session:${sessionId}`) || "null");
        } catch {
          return null;
        }
      }

      function persistMessages(messages) {
        const session = readSession();

        if (messages.length === 0) {
          if (session) {
            localStorage.removeItem(`session:${session.id}`);
          }
          setSessionIdInUrl("");
          renderMessages();
          renderSessionList();
          return null;
        }

        const now = new Date().toISOString();
        const newSessionId = Array.from(
          { length: 8 },
          () => "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"[Math.floor(Math.random() * 62)]
        ).join("");
        const nextSession = {
          id: session?.id || newSessionId,
          createdAt: session?.createdAt || now,
          updatedAt: now,
          messages
        };

        setSessionIdInUrl(nextSession.id);
        localStorage.setItem(`session:${nextSession.id}`, JSON.stringify(nextSession));
        renderMessages();
        renderSessionList();
        return nextSession;
      }

      function renderMessages() {
        output.textContent = (readSession()?.messages || [])
          .map((message) => `${message.role}: ${message.content}`)
          .join("\n\n");
      }

      function renderSessionList() {
        sessionList.textContent = "";

        Object.keys(localStorage)
          .filter((key) => key.startsWith("session:"))
          .map((key) => {
            try {
              return JSON.parse(localStorage.getItem(key));
            } catch {
              return null;
            }
          })
          .filter((session) => session?.id && session.updatedAt)
          .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
          .forEach((session) => {
            const firstUserMessage = session.messages?.find((message) => message.role === "user")?.content || "Untitled session";
            const title = firstUserMessage.length > 40 ? `${firstUserMessage.slice(0, 40)}…` : firstUserMessage;
            const updatedAt = new Date(session.updatedAt);
            const formattedUpdatedAt = [
              String(updatedAt.getDate()).padStart(2, "0"),
              String(updatedAt.getMonth() + 1).padStart(2, "0"),
              updatedAt.getFullYear()
            ].join("/") + ` ${String(updatedAt.getHours()).padStart(2, "0")}:${String(updatedAt.getMinutes()).padStart(2, "0")}`;
            const item = document.createElement("li");
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = `${title} ${formattedUpdatedAt}`;
            button.addEventListener("click", () => {
              setSessionIdInUrl(session.id);
              renderMessages();
              renderSessionList();
            });

            item.appendChild(button);
            sessionList.appendChild(item);
          });
      }

      settingsButton.addEventListener("click", () => {
        apiKeyInput.value = apiKey;
        modelInput.value = model;
        settingsDialog.showModal();
      });

      saveSettingsButton.addEventListener("click", () => {
        apiKey = apiKeyInput.value;
        model = modelInput.value;
        localStorage.setItem("openrouterApiKey", apiKey);
        localStorage.setItem("openrouterModel", model);
        settingsDialog.close();
      });

      newSessionButton.addEventListener("click", () => {
        const url = new URL(location.href);
        url.searchParams.delete("session");
        history.pushState(null, "", url);
        renderMessages();
        renderSessionList();
      });

      window.addEventListener("popstate", () => {
        renderMessages();
        renderSessionList();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!apiKey) {
          errorMessage.textContent = "API key is missing. Add it in Settings.";
          errorDialog.showModal();
          return;
        }

        const promptInput = document.getElementById("prompt");
        const prompt = promptInput.value;
        const messagesBeforeSend = readSession()?.messages || [];
        const persistedSession = persistMessages([...messagesBeforeSend, { role: "user", content: prompt }]);
        promptInput.value = "";

        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json",
              "HTTP-Referer": location.origin,
              "X-Title": "Minimal OpenRouter Static Site"
            },
            body: JSON.stringify({
              model,
              messages: persistedSession.messages
            })
          });

          const data = await response.json();

          if (!response.ok) {
            persistMessages(messagesBeforeSend);
            promptInput.value = prompt;
            errorMessage.textContent = JSON.stringify(data, null, 2);
            errorDialog.showModal();
            return;
          }

          const assistantContent = data.choices?.[0]?.message?.content ?? JSON.stringify(data, null, 2);
          persistMessages([...(readSession()?.messages || []), { role: "assistant", content: assistantContent }]);
        } catch (error) {
          persistMessages(messagesBeforeSend);
          promptInput.value = prompt;
          errorMessage.textContent = String(error);
          errorDialog.showModal();
        }
      });

      if (!readSession()) {
        setSessionIdInUrl("");
      }

      renderMessages();
      renderSessionList();
    </script>
  </body>
</html>
