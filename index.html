<!doctype html>
<html>
  <body>
    <form id="form">
      <div>
        <button id="settingsButton" type="button">Settings</button>
      </div>

      <div>
        <label>
          Model slug
          <input id="model" value="tencent/hy3:free" required>
        </label>
      </div>

      <div>
        <label>
          Prompt
          <textarea id="prompt" required>hi</textarea>
        </label>
      </div>

      <button>Send</button>
    </form>

    <dialog id="settingsDialog">
      <form method="dialog">
        <div>
          <label>
            API key
            <input id="apiKeyInput" type="password">
          </label>
        </div>

        <button id="saveSettingsButton" type="button">Save</button>
        <button type="submit">Cancel</button>
      </form>
    </dialog>

    <dialog id="errorDialog">
      <form method="dialog">
        <p id="errorMessage"></p>
        <button type="submit">OK</button>
      </form>
    </dialog>

    <pre id="output"></pre>

    <script>
      const form = document.getElementById("form");
      const output = document.getElementById("output");
      const settingsButton = document.getElementById("settingsButton");
      const settingsDialog = document.getElementById("settingsDialog");
      const apiKeyInput = document.getElementById("apiKeyInput");
      const saveSettingsButton = document.getElementById("saveSettingsButton");
      const errorDialog = document.getElementById("errorDialog");
      const errorMessage = document.getElementById("errorMessage");

      let apiKey = localStorage.getItem("openrouterApiKey") || "";

      settingsButton.addEventListener("click", () => {
        apiKeyInput.value = apiKey;
        settingsDialog.showModal();
      });

      saveSettingsButton.addEventListener("click", () => {
        apiKey = apiKeyInput.value;
        localStorage.setItem("openrouterApiKey", apiKey);
        settingsDialog.close();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!apiKey) {
          errorMessage.textContent = "API key is missing. Add it in Settings.";
          errorDialog.showModal();
          return;
        }

        output.textContent = "Loading...";

        const model = document.getElementById("model").value;
        const prompt = document.getElementById("prompt").value;

        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json",
              "HTTP-Referer": location.origin,
              "X-Title": "Minimal OpenRouter Static Site"
            },
            body: JSON.stringify({
              model,
              messages: [
                { role: "user", content: prompt }
              ]
            })
          });

          const data = await response.json();

          if (!response.ok) {
            output.textContent = JSON.stringify(data, null, 2);
            return;
          }

          output.textContent = data.choices?.[0]?.message?.content ?? JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
